name: Export Notion Data to JSON

on:
  # 每小时 :30 分触发，爬虫跑完后再导出
  schedule:
    - cron: "30 * * * *"

  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: 导出 Notion 数据为 JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r crawlers/requirements.txt

      - name: Export Notion data to JSON
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/export_notion_data.py

      - name: Deploy data.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          commit_message: "data: update notion export ${{ github.run_number }}"
